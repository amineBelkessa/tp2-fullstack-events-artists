# docker-compose.yml
services:
  # Backend Spring Boot
  backend:
    image: eclipse-temurin:21-jre
    container_name: events-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    command: java -jar event-0.0.1-SNAPSHOT.jar
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/artists || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - app-network
    environment:
      - JAVA_OPTS=-Xmx512m

  # Frontend Vite React
  frontend:
    image: node:20-alpine
    container_name: events-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  # Init Script - Seed database with initial data
  init-data:
    image: curlimages/curl:latest
    container_name: events-init-data
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./init-data.sh:/init-data.sh
    command: sh /init-data.sh
    networks:
      - app-network

networks:
  app-network:
    driver: bridge